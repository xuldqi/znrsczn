version: '3.8'

services:
  # n8n 工作流自动化
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: bambumoon_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.bambumoon.cn
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.bambumoon.cn/
      - GENERIC_TIMEZONE=Asia/Shanghai
      - N8N_ENCRYPTION_KEY=mySecretEncryptionKey2024
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=true
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console
      # 数据库配置
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_password_2024
      # Redis 配置
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows
      - ./n8n-backups:/home/node/.n8n/backups
    depends_on:
      - postgres
      - redis
    networks:
      - bambumoon_network

  # Redis for n8n queue management
  redis:
    image: redis:7-alpine
    container_name: bambumoon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bambumoon_network

  # PostgreSQL for n8n data persistence
  postgres:
    image: postgres:15-alpine
    container_name: bambumoon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bambumoon_network

  # 后端 API 服务器
  api_server:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: bambumoon_api
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      - NODE_ENV=production
      - PORT=1337
    volumes:
      - ../articles.json:/app/articles.json
      - ../n8n-backups:/app/n8n-backups
    depends_on:
      - n8n
    networks:
      - bambumoon_network

volumes:
  n8n_data:
  redis_data:
  postgres_data:

networks:
  bambumoon_network:
    driver: bridge